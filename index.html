        let web3;
        let contract;
        let account;

        async function connectWallet() {
            if (window.ethereum) {
                web3 = new Web3(window.ethereum);
                try {
                    await ethereum.request({ method: 'eth_requestAccounts' });
                    account = (await web3.eth.getAccounts())[0];
                    document.getElementById('walletAddress').innerText = `Connected: ${account}`;
                    contract = new web3.eth.Contract(contractABI, contractAddress);
                    updateBalances();
                } catch (error) {
                    console.error("User denied account access", error);
                }
            } else {
                alert('MetaMask is not installed');
            }
        }

        async function updateBalances() {
            console.log('updateBalances function called.'); // This log should appear after the button click log
            try {
                const balance = await contract.methods.balanceOf(account).call();
                const stakedAmount = await contract.methods.stakesOf(account).call();
                const rewards = await contract.methods.rewardsOf(account).call();
        
                console.log('Fetched balances:', { balance, stakedAmount, rewards }); // Log fetched balances
                document.getElementById('balance').innerText = web3.utils.fromWei(balance, 'ether');
                document.getElementById('stakedAmount').innerText = web3.utils.fromWei(stakedAmount, 'ether');
                document.getElementById('rewards').innerText = web3.utils.fromWei(rewards, 'ether');
            } catch (error) {
                console.error("Error updating balances:", error); // Log any errors
            }
        }

        async function stakeTokens() {
            const amount = document.getElementById('stakeAmount').value;
            const amountInWei = web3.utils.toWei(amount, 'ether');
            await contract.methods.stake(amountInWei).send({ from: account });
            updateBalances();
            //setInterval(updateBalances, 10000);
        }

        async function unstakeTokens() {
            const amount = document.getElementById('unstakeAmount').value;
            const amountInWei = web3.utils.toWei(amount, 'ether');
            await contract.methods.unstake(amountInWei).send({ from: account });
            updateBalances();
        }

        async function claimRewards() {
            await contract.methods.claimRewards().send({ from: account });
            updateBalances();
        }
