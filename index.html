<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Include Web3.js -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.7.0/dist/web3.min.js"></script>
    <!-- Your app.js script -->
    <script src="scripts/app.js"></script>
    </body>
    </html>
    
    <!-- Meta tags and title -->
    <meta charset="UTF-8">
    <title>Kinetic Web App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Custom Styles (optional inline styles) -->
    <style>
        /* Adjusting the connection status alert */
        #connectionStatus {
            font-weight: bold;
        }

        /* Styling the STATS section */
        #stats {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
        }

        #stats h2 {
            margin-top: 0;
        }

        /* Custom styles for warnings */
        #stats .warning {
            color: #dc3545;
            font-weight: bold;
        }

        
        /* Toast Positioning */
        #toastContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1051;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Kinetic Web App</a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-4">
        <!-- Connection Status -->
        <div id="connectionStatus" class="alert alert-info" role="alert">
            Connecting to MetaMask...
        </div>

        <!-- Row for Token Selection and Balances -->
        <div class="row">
            <!-- Token Selection -->
            <div class="col-md-4">
                <div class="mb-3">
                    <label for="tokenSelect" class="form-label">Select Token:</label>
                    <select id="tokenSelect" class="form-select"></select>
                </div>
            </div>
            <!-- Balances -->
            <div class="col-md-8">
                <h2>Balances</h2>
                <ul class="list-group">
                    <li class="list-group-item" id="walletBalance">Wallet Balance: </li>
                    <li class="list-group-item" id="supplyBalance">Supply Balance: </li>
                    <li class="list-group-item" id="borrowBalance">Borrow Balance: </li>
                </ul>
            </div>
        </div>

        <!-- Actions -->
        <div class="my-4">
            <h2>Actions</h2>
            <div class="btn-group flex-wrap" role="group">
                <button class="btn btn-primary mb-2" data-bs-toggle="modal" data-bs-target="#supplyModal">
                    <i class="bi bi-arrow-up-circle"></i> Supply Tokens
                </button>
                <button class="btn btn-secondary mb-2" data-bs-toggle="modal" data-bs-target="#removeSupplyModal">
                    <i class="bi bi-arrow-down-circle"></i> Remove Supply
                </button>
                <button class="btn btn-success mb-2" data-bs-toggle="modal" data-bs-target="#borrowModal">
                    <i class="bi bi-cart-plus"></i> Borrow Tokens
                </button>
                <button class="btn btn-warning mb-2" data-bs-toggle="modal" data-bs-target="#repayModal">
                    <i class="bi bi-cart-dash"></i> Repay Loan
                </button>
                <button onclick="viewInterestRates()" class="btn btn-info mb-2">
                    <i class="bi bi-info-circle"></i> View Interest Rates
                </button>
                <button onclick="rebalanceLoan()" class="btn btn-danger mb-2">
                    <i class="bi bi-arrow-repeat"></i> Rebalance Loan
                </button>
            </div>
        </div>

        <!-- STATS Section -->
        <div id="stats" class="my-4">
            <!-- STATS will be displayed here -->
        </div>
    </div>

    <!-- Modals -->
    <!-- Supply Tokens Modal -->
    <div class="modal fade" id="supplyModal" tabindex="-1" aria-labelledby="supplyModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="supplyModalLabel">Supply Tokens</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <!-- Modal Body -->
                <div class="modal-body">
                    <label for="supplyAmount" class="form-label">Enter amount to supply:</label>
                    <input type="number" class="form-control" id="supplyAmount" min="0" step="any">
                </div>
                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="confirmSupply()">Supply</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Remove Supply Modal -->
    <div class="modal fade" id="removeSupplyModal" tabindex="-1" aria-labelledby="removeSupplyModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="removeSupplyModalLabel">Remove Supply</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <!-- Modal Body -->
                <div class="modal-body">
                    <label for="removeSupplyAmount" class="form-label">Enter amount to remove from supply (or 'all'):</label>
                    <input type="text" class="form-control" id="removeSupplyAmount">
                </div>
                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="confirmRemoveSupply()">Remove Supply</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Borrow Tokens Modal -->
    <div class="modal fade" id="borrowModal" tabindex="-1" aria-labelledby="borrowModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="borrowModalLabel">Borrow Tokens</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <!-- Modal Body -->
                <div class="modal-body">
                    <label for="borrowAmount" class="form-label">Enter amount to borrow:</label>
                    <input type="number" class="form-control" id="borrowAmount" min="0" step="any">
                </div>
                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="confirmBorrow()">Borrow</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Repay Loan Modal -->
    <div class="modal fade" id="repayModal" tabindex="-1" aria-labelledby="repayModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="repayModalLabel">Repay Loan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <!-- Modal Body -->
                <div class="modal-body">
                    <label for="repayAmount" class="form-label">Enter amount to repay (or 'all'):</label>
                    <input type="text" class="form-control" id="repayAmount">
                </div>
                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="confirmRepay()">Repay</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <!-- Toast content will be injected here -->
        </div>
    </div>

    <!-- Loading Spinner -->
   <!-- Remove or comment out the Loading Spinner -->
    



    <!-- Bootstrap JS Bundle and your app.js script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
